    const DB_NAME = 'berex_photos'; const STORE = 'photos'; const VER = 1;
    const open = () => new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, VER);
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return {
      async save(key, dataUrl) { const db = await open(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(dataUrl, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
      async get(key) { const db = await open(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readonly'); const req = tx.objectStore(STORE).get(key); req.onsuccess = () => res(req.result || null); req.onerror = () => rej(req.error); }); },
      async remove(key) { const db = await open(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).delete(key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
      async getAll(keys) { if (!keys?.length) return []; const db = await open(); const tx = db.transaction(STORE, 'readonly'); const store = tx.objectStore(STORE); return Promise.all(keys.map(k => new Promise(r => { const req = store.get(k); req.onsuccess = () => r({key: k, data: req.result}); req.onerror = () => r({key: k, data: null}); }))); },

  const setupScrollClose = (el, closeFn) => {
    if (!el || el._scrollCloseSetup) return;
    el._scrollCloseSetup = true;
    el._bottomSeen = false;
    const fixedWrap = el.closest('.fixed') || el.closest('.maximize-overlay');
    const modal = fixedWrap ? (fixedWrap.children.length > 0 ? fixedWrap.children[fixedWrap.children.length - 1] : fixedWrap) : el.parentElement;
    el.addEventListener('scroll', () => {
      if (el.scrollHeight > el.clientHeight + 10 && el.scrollTop + el.clientHeight >= el.scrollHeight - 2) el._bottomSeen = true;
    }, {passive:true});
    el.addEventListener('touchstart', (e) => {
      el._pullY = e.touches[0].clientY;
      const atBot = el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
      el._readyToClose = el._bottomSeen && atBot;
      el._pulling = false;
    }, {passive:true});
    el.addEventListener('touchmove', (e) => {
      if (!el._readyToClose) return;
      const dy = e.touches[0].clientY - el._pullY;
      if (dy < 0) {
        const pull = Math.min(Math.abs(dy), 120);
        if (modal) { modal.style.transform = 'translateY(' + (-pull) + 'px)'; modal.style.transition = 'none'; }
        if (pull > 50) el._pulling = true;
      }
    }, {passive:true});
    el.addEventListener('touchend', () => {
      if (el._pulling && el._readyToClose) {
        if (modal) { modal.style.transition = 'transform 0.25s ease-out'; modal.style.transform = 'translateY(-100%)'; }

        if (modal) { modal.style.transition = 'transform 0.2s ease-out'; modal.style.transform = ''; }

    }, {passive:true});

            {(!!userTouched.mattress || !!userTouched.frame) && priceData && (
            <div style={{marginTop:'12px', padding:'12px', borderRadius:'4px', background:'#fff8f0', border:'1px solid #fde2c8'}}>
              <div style={{fontSize:'11px', fontWeight:700, color:'#e9914b', marginBottom:'4px'}}>렌탈 혜택 미리보기</div>
              <div style={{fontSize:'11px', color:'var(--color-text-secondary)', lineHeight:1.5}}>
                2개 이상 함께 담으면 <span style={{fontWeight:700, color:'var(--color-discount)'}}>7월 15%(2개이상) + 자동이체 1,000원</span> 할인<br/>
                → {_krFmt.format(priceData.rental)} → 약 {_krFmt.format(Math.max(0, Math.ceil((priceData.rental * 0.85) / 10) * 10 - 1000))}원/월
              </div>
            </div>
            )}
            {/* 특장점 */}
            <div style={{marginTop:'16px'}}>
              <div style={{fontSize:'11px', fontWeight:600, color:'var(--color-text-tertiary)', marginBottom:'6px'}}>특장점</div>
              {model.features.map((f, i) => <div key={i} style={{fontSize:'11px', color:'var(--color-text-secondary)', padding:'3px 0'}}>• {f}</div>)}
            </div>
          </div>
          {/* Step 2 하단 */}
          <div style={{padding:'12px 20px 32px', flexShrink:0, borderTop:'1px solid var(--color-border)', background:'var(--color-background)'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'10px'}}>
              <span style={{fontSize:'12px', color:'var(--color-text-secondary)'}}>{selCare} · {selPeriod}년</span>
              <span style={{fontFamily:'var(--font-number)', fontSize:'22px', fontWeight:600, color:'var(--color-text-primary)', letterSpacing:'-0.03em'}}>{_krFmt.format(priceData?.rental || 0)}<span style={{fontSize:'13px', fontWeight:400, color:'var(--color-text-secondary)'}}>원/월</span></span>
            </div>
            <div style={{display:'flex', gap:'8px'}}>
              <button onClick={() => setHealingModalStep(1)} style={{flex:1, padding:'14px', borderRadius:'4px', border:'1px solid var(--color-border)', background:'transparent', fontSize:'13px', fontWeight:600, cursor:'pointer', color:'var(--color-text-secondary)'}}>← 이전</button>
              <button onClick={() => {
                setActiveHealing(healingModalSelection);
                setHealingCare(selCare);
                setHealingPeriod(Number(selPeriod));
                setIsHealingModalOpen(false);
                showToast(`${model.name} 추가 완료`);
              }} style={{flex:2, padding:'14px', borderRadius:'4px', border:'none', background:'var(--color-accent)', color:'#fff', fontSize:'15px', fontWeight:700, cursor:'pointer'}}>추가하기</button>
            </div>
          </div>
          </>);
        })()}
        </>)}
      </div>
      )}
    </div>
    );
  };
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
