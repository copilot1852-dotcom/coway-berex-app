        width:5px; height:5px; border-radius:50%; background:#2eaadc;

<script>
  (function() {
    const guide = document.getElementById('pwa-install-guide');
    const installButton = document.getElementById('pwa-install-button');
    const closeButton = document.getElementById('pwa-install-close');
    const help = document.getElementById('pwa-install-help');
    if (!guide || !installButton || !closeButton || !help) return;

    let deferredPrompt = null;
    const closedKey = 'berex_pwa_install_closed';
    const isStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    const hideGuide = () => {
      guide.hidden = true;
    };

    const showGuide = mode => {
      if (isStandalone() || sessionStorage.getItem(closedKey) === '1') return;
      installButton.hidden = mode !== 'prompt';
      help.textContent = mode === 'prompt'
        ? '아래 버튼을 누르면 브라우저의 설치 확인창이 열립니다.'
        : isIOS
          ? 'Safari에서 공유 버튼을 누른 뒤 홈 화면에 추가를 선택해주세요.'
          : 'Chrome 메뉴(오른쪽 위 점 3개)에서 앱 설치 또는 홈 화면에 추가를 선택해주세요.';
      guide.hidden = false;
    };

    closeButton.addEventListener('click', () => {
      sessionStorage.setItem(closedKey, '1');
      hideGuide();
    });

    installButton.addEventListener('click', async () => {
      if (!deferredPrompt) {
        showGuide('manual');
        return;
      }
      const promptEvent = deferredPrompt;
      deferredPrompt = null;
      promptEvent.prompt();
      const choice = await promptEvent.userChoice.catch(() => null);
      if (choice && choice.outcome === 'accepted') {
        hideGuide();
      } else {
        showGuide('manual');
      }
    });

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      showGuide('prompt');
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      hideGuide();
    });

    setTimeout(() => {
      if (!deferredPrompt) showGuide('manual');
    }, 2500);
  })();
</script>
