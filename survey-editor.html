// 칩 태그
const Tag = ({text, color='accent'}) => {
  const colors = {
    accent: {bg:'var(--accent-bg)', c:'var(--accent)'},
    red: {bg:'var(--red-bg)', c:'var(--red)'},
    blue: {bg:'var(--blue-bg)', c:'var(--blue)'},
    orange: {bg:'var(--orange-bg)', c:'var(--orange)'},
    gray: {bg:'rgba(174,174,178,0.12)', c:'var(--text3)'},
  };
  const s = colors[color] || colors.accent;
  return <span style={{display:'inline-block',padding:'3px 8px',borderRadius:'6px',fontSize:'11px',fontWeight:600,background:s.bg,color:s.c,lineHeight:1.4}}>{text}</span>;
};

// 섹션 아코디언
const Section = ({title, badge, children, defaultOpen=false, color='var(--accent)'}) => {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div style={{background:'var(--card)',borderRadius:'var(--radius)',overflow:'hidden',border:'1px solid var(--border)'}}>
      <button onClick={()=>setOpen(!open)} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 18px',border:'none',background:'transparent',color:'var(--text)',cursor:'pointer'}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          <div style={{width:'4px',height:'20px',borderRadius:'2px',background:color}} />
          <span style={{fontSize:'15px',fontWeight:700}}>{title}</span>
          {badge != null && <span style={{fontSize:'11px',fontWeight:700,color:'var(--text3)',background:'var(--border)',borderRadius:'10px',padding:'2px 8px'}}>{badge}</span>}
        </div>
        <span style={{fontSize:'18px',color:'var(--text3)',transition:'transform 0.2s',transform:open?'rotate(180deg)':'rotate(0)'}}>{'\u25BE'}</span>
      </button>
      {open && <div style={{padding:'0 18px 18px',display:'flex',flexDirection:'column',gap:'8px'}}>{children}</div>}
    </div>
  );
};

// 칩 편집기 — 태그를 개별 추가/삭제
const ChipEditor = ({items=[], onChange, color='accent', placeholder='항목 입력 후 Enter'}) => {
  const [input, setInput] = useState('');
  const addChip = () => { const v = input.trim(); if (v && !items.includes(v)) { onChange([...items, v]); setInput(''); } };
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
      <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
        {items.map((t,i) => (
          <span key={i} style={{display:'inline-flex',alignItems:'center',gap:'4px',padding:'4px 8px',borderRadius:'8px',fontSize:'11px',fontWeight:600,background:'var(--accent-bg)',color:'var(--accent)'}}>
            {t}
            <button onClick={()=>onChange(items.filter((_,j)=>j!==i))} style={{background:'none',border:'none',color:'var(--red)',fontSize:'12px',cursor:'pointer',padding:0,lineHeight:1}}>✕</button>
          </span>
        ))}
      </div>
      <div style={{display:'flex',gap:'4px'}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addChip();}}}
          placeholder={placeholder} style={{flex:1,padding:'6px 10px',borderRadius:'8px',border:'1px solid var(--border)',background:'var(--bg)',color:'var(--text)',fontSize:'12px',outline:'none'}} />
        <button onClick={addChip} style={{padding:'6px 10px',borderRadius:'8px',border:'none',background:'var(--accent)',color:'#000',fontSize:'11px',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>추가</button>
      </div>
    </div>
  );
};

// 토글 스위치
const Toggle = ({on, onToggle, label}) => (
  <button onClick={onToggle} style={{display:'flex',alignItems:'center',gap:'8px',background:'none',border:'none',cursor:'pointer',padding:'4px 0'}}>
    <div style={{width:'36px',height:'20px',borderRadius:'10px',background:on?'var(--accent)':'var(--border)',position:'relative',transition:'background 0.2s'}}>
      <div style={{width:'16px',height:'16px',borderRadius:'8px',background:'#fff',position:'absolute',top:'2px',left:on?'18px':'2px',transition:'left 0.2s',boxShadow:'0 1px 3px rgba(0,0,0,0.3)'}} />
    </div>
    <span style={{fontSize:'12px',fontWeight:500,color:on?'var(--text)':'var(--text3)'}}>{label}</span>
  </button>
);

// 인라인 텍스트 편집 — 항상 입력 가능, blur 시 자동 저장
const InlineEdit = ({value, onChange, bold, placeholder, style:_s}) => {
  return (
    <input value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder||''}
      style={{width:'100%',padding:'4px 8px',borderRadius:'6px',border:'1px solid var(--border)',background:'var(--bg)',color:'var(--text)',fontSize:bold?'14px':'12px',fontWeight:bold?700:500,outline:'none',..._s}}
      onFocus={e=>e.target.style.borderColor='var(--accent)'}
      onBlur={e=>e.target.style.borderColor='var(--border)'} />
  );
};

  {id:'doublechainge',label:'더블체인지',h:295},{id:'compactfoam',label:'컴팩트폼',h:210},
];
const FRAME_LIST = [
  {id:'foundation',label:'파운데이션',h:290},{id:'woody',label:'우디',h:290},

  {id:'myframeBasic',label:'마이프레임B',h:200},{id:'myframeSide',label:'마이프레임S',h:200},
  {id:'family',label:'패밀리',h:65},{id:'grace',label:'그레이스',h:190},
];
// 제품 조합 높이 계산 (주요 조합만)
const getProductCombos = () => {
  const combos = [];
  MATTRESS_LIST.forEach(m => {
    FRAME_LIST.forEach(f => {
      const cm = (m.h + f.h) / 10;
      combos.push({ mattress: m.label, frame: f.label, cm, key: m.id+'_'+f.id });
    });
  });
  return combos.sort((a,b) => a.cm - b.cm);
};
const ALL_COMBOS = getProductCombos();

// 원클릭 토글 칩 그룹
const ChipToggleGroup = ({items, selected=[], onChange, radio=false, color='accent'}) => {
  const toggle = (id) => {
    if (radio) { onChange(id); return; }
    onChange(selected.includes(id) ? selected.filter(x=>x!==id) : [...selected, id]);
  };
  const colors = {accent:'var(--accent)', blue:'var(--blue)', red:'var(--red)', orange:'var(--orange)'};
  const c = colors[color] || colors.accent;
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:'5px'}}>
      {items.map(it => {
        const on = radio ? selected === it.id : (selected||[]).includes(it.id);
        return (
          <button key={it.id} onClick={()=>toggle(it.id)} style={{padding:'5px 10px',borderRadius:'8px',fontSize:'11px',fontWeight:on?700:500,cursor:'pointer',
            border:on?`1.5px solid ${c}`:'1.5px solid var(--border)',
            background:on?c+'1a':'transparent',
            color:on?c:'var(--text3)',
            transition:'all 0.15s'}}>
            {on ? '✓ ' : ''}{it.label}
          </button>
        );
      })}
    </div>
  );
};

// 높이 보정 미니 입력
const HeightAdjMini = ({adj, onChange}) => {
  const CmIn = ({label, val, field}) => (
    <div style={{display:'flex',alignItems:'center',gap:'4px'}}>
      <span style={{fontSize:'10px',color:'var(--text3)',whiteSpace:'nowrap'}}>{label}</span>
      <input type="number" value={val} onChange={e=>onChange({...adj,[field]:parseInt(e.target.value)||0})}
        style={{width:'46px',padding:'5px 4px',borderRadius:'6px',border:'1px solid var(--border)',background:'var(--bg)',color:'var(--text)',fontSize:'12px',fontWeight:700,textAlign:'center',outline:'none'}} />
    </div>
  );
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
        <span style={{fontSize:'11px',color:'var(--text2)',fontWeight:600,minWidth:'64px'}}>침대 있을때</span>
        <CmIn label="최대" val={adj.withBed_max} field="withBed_max" />
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
        <span style={{fontSize:'11px',color:'var(--text2)',fontWeight:600,minWidth:'64px'}}>처음 구매</span>
        <CmIn label="최소" val={adj.noBed_min} field="noBed_min" />
        <CmIn label="최대" val={adj.noBed_max} field="noBed_max" />
      </div>
    </div>
  );
};

// 숨김/보임 버튼
const VisToggle = ({hidden, onToggle}) => (
  <button onClick={onToggle} title={hidden?'숨김 중 — 클릭하여 보이기':'보이는 중 — 클릭하여 숨기기'}
    style={{width:'28px',height:'28px',borderRadius:'8px',border:'1px solid '+(hidden?'var(--red)':'var(--accent)'),background:hidden?'var(--red-bg)':'var(--accent-bg)',color:hidden?'var(--red)':'var(--accent)',fontSize:'14px',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,cursor:'pointer'}}>
    {hidden?'⊘':'◉'}
  </button>
);

// 범용 구조화 카드 (접기/펼치기 + 숨김 토글)
const StructCard = ({item, onEdit, label, headerExtra, children}) => {
  const [open, setOpen] = useState(!item.hidden);
  const hidden = !!item.hidden;
  const update = (patch) => onEdit({...item, ...patch});
  return (
    <div style={{background:'var(--surface)',borderRadius:'12px',border:'1px solid '+(hidden?'var(--red)':'var(--border)'),overflow:'hidden',opacity:hidden?0.5:1,transition:'opacity 0.2s'}}>
      <div style={{display:'flex',alignItems:'center',gap:'8px',padding:'12px 14px',borderBottom:open&&!hidden?'1px solid var(--border)':'none'}}>
        <button onClick={()=>setOpen(!open)} style={{background:'none',border:'none',color:'var(--text3)',fontSize:'14px',cursor:'pointer',padding:0}}>{open&&!hidden?'▾':'▸'}</button>
        <InlineEdit value={item.label||label||''} onChange={v=>update({label:v})} bold placeholder="이름" style={{flex:1}} />
        {headerExtra}
        <VisToggle hidden={hidden} onToggle={()=>update({hidden:!hidden})} />
      </div>
      {open && !hidden && children && (
        <div style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:'12px'}}>{children}</div>
      )}
      {hidden && <div style={{padding:'6px 14px',fontSize:'11px',color:'var(--red)',fontWeight:500}}>앱에서 숨겨짐</div>}
    </div>
  );
};

// 섹션 라벨
const SLabel = ({text}) => <div style={{fontSize:'11px',fontWeight:700,color:'var(--text3)',marginBottom:'6px',letterSpacing:'0.05em'}}>{text}</div>;

// 추천값 비교 배지
const RecBadge = ({current, recommended, label}) => {
  if (recommended === undefined) return null;
  const eq = JSON.stringify(current) === JSON.stringify(recommended);
  return eq
    ? <span style={{fontSize:'9px',fontWeight:700,color:'var(--accent)',background:'var(--accent-bg)',padding:'2px 6px',borderRadius:'4px',marginLeft:'4px'}}>추천 ✓</span>
    : <span style={{fontSize:'9px',fontWeight:700,color:'var(--orange)',background:'var(--orange-bg)',padding:'2px 6px',borderRadius:'4px',marginLeft:'4px',cursor:'pointer'}} title={'추천: '+JSON.stringify(recommended)}>추천값과 다름</span>;
};

// 조건 카드 (구조화 UI)
const ConditionCard = ({item, onEdit}) => {
  const update = (patch) => onEdit({...item, ...patch});
  const r = item.rec || {};
  return (
    <StructCard item={item} onEdit={onEdit}>
      <InlineEdit value={item.desc} onChange={v=>update({desc:v})} placeholder="설명" style={{fontSize:'12px',color:'var(--text3)'}} />
      <div>
        <div style={{display:'flex',alignItems:'center'}}><SLabel text="케어 자동설정" /><RecBadge current={item.care} recommended={r.care} /></div>
        <ChipToggleGroup items={CARE_LIST} selected={item.care} onChange={v=>update({care:v})} radio color="accent" />
      </div>
      <div>
        <div style={{display:'flex',alignItems:'center'}}><SLabel text="높이 보정 (cm)" /><RecBadge current={item.heightAdj} recommended={r.heightAdj} /></div>
        <HeightAdjMini adj={item.heightAdj||{withBed_max:0,noBed_min:0,noBed_max:0}} onChange={v=>update({heightAdj:v})} />
      </div>
      <div>
        <div style={{display:'flex',alignItems:'center'}}><SLabel text="추천 매트리스" /><RecBadge current={item.recommendMattress||[]} recommended={r.recommendMattress} /></div>
        <ChipToggleGroup items={MATTRESS_LIST} selected={item.recommendMattress||[]} onChange={v=>update({recommendMattress:v})} color="blue" />
        <div style={{fontSize:'10px',color:'var(--text3)',marginTop:'4px'}}>선택 없음 = 전체 가능</div>
      </div>
      {((item.excludeModels||[]).length > 0 || item.id === 'heating') && <div>
        <div style={{display:'flex',alignItems:'center'}}><SLabel text="제외 모델" /><RecBadge current={item.excludeModels||[]} recommended={r.excludeModels} /></div>
        <ChipToggleGroup items={MATTRESS_LIST} selected={item.excludeModels||[]} onChange={v=>update({excludeModels:v})} color="red" />
      </div>}
      <div>
        <div style={{display:'flex',alignItems:'center'}}><SLabel text="추천 프레임" /><RecBadge current={item.recommendFrame||[]} recommended={r.recommendFrame} /></div>
        <ChipToggleGroup items={FRAME_LIST} selected={item.recommendFrame||[]} onChange={v=>update({recommendFrame:v})} color="blue" />
        <div style={{fontSize:'10px',color:'var(--text3)',marginTop:'4px'}}>선택 없음 = 사용자 선택 유지</div>
      </div>
      <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
        <Toggle on={item.hasDetail} label="Step 2 상세질문" onToggle={()=>update({hasDetail:!item.hasDetail})} />
        <Toggle on={item.lowFrame} label="저상형 프레임 추천" onToggle={()=>update({lowFrame:!item.lowFrame})} />
      </div>
    </StructCard>
  );
};

// 항목 카드 (인라인 편집)
const ItemCard = ({item, fields, onDelete, onEdit, children}) => {
  return (
    <div style={{background:'var(--surface)',borderRadius:'12px',border:'1px solid var(--border)',padding:'12px 14px',position:'relative'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'8px'}}>
        <div style={{flex:1,minWidth:0}}>
          {fields.map(f => {
            const val = item[f.key];
            // 태그 배열 — 칩 편집기
            if (f.type === 'tags' && onEdit) return (
              <div key={f.key} style={{marginTop:'6px'}}>
                <div style={{fontSize:'10px',fontWeight:600,color:'var(--text3)',marginBottom:'4px'}}>{f.label}</div>
                <ChipEditor items={val||[]} color={f.color||'accent'} placeholder={f.placeholder||'항목 입력 후 Enter'}
                  onChange={newArr=>onEdit({...item,[f.key]:newArr})} />
              </div>
            );
            if (f.type === 'tags') return (!val || val.length === 0) ? null : <div key={f.key} style={{display:'flex',flexWrap:'wrap',gap:'4px',marginTop:'4px'}}>{val.map((t,i) => <Tag key={i} text={t} color={f.color||'accent'}/>)}</div>;
            // sub 텍스트 — 인라인 편집
            if (f.type === 'sub' && onEdit) return (
              <div key={f.key} style={{marginTop:'2px'}}>
                <InlineEdit value={val||''} onChange={v=>onEdit({...item,[f.key]:v})} placeholder={f.label} style={{fontSize:'12px',color:'var(--text3)'}} />
              </div>
            );
            if (f.type === 'sub') return val ? <div key={f.key} style={{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}}>{val}</div> : null;
            // 볼드 텍스트 — 인라인 편집
            if (onEdit) return (
              <InlineEdit key={f.key} value={val||''} onChange={v=>onEdit({...item,[f.key]:v})} bold={f.bold} placeholder={f.label} />
            );
            return <div key={f.key} style={{fontSize:'14px',fontWeight:f.bold?700:500,color:f.dim?'var(--text2)':'var(--text)'}}>{val}</div>;
          })}
          {children}
        </div>
        <div style={{display:'flex',gap:'4px',flexShrink:0}}>
          {onDelete && <button onClick={()=>onDelete(item)} style={{width:'28px',height:'28px',borderRadius:'8px',border:'1px solid var(--red)',background:'var(--red-bg)',color:'var(--red)',fontSize:'13px',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>}
        </div>
      </div>
    </div>
  );
};

// 추가 버튼
const AddButton = ({onClick, label='항목 추가'}) => (
  <button onClick={onClick} style={{width:'100%',padding:'12px',borderRadius:'12px',border:'2px dashed var(--border)',background:'transparent',color:'var(--text3)',fontSize:'13px',fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'6px',transition:'border-color 0.2s'}}
    onMouseEnter={e=>e.target.style.borderColor='var(--accent)'}
    onMouseLeave={e=>e.target.style.borderColor='var(--border)'}>
    + {label}
  </button>
);

// ═══════════════════════════════════════════════
// 메인 앱
// ═══════════════════════════════════════════════
function App() {
  const [data, setData] = useState(() => {
    try {
      const s = localStorage.getItem('survey_editor_data');
      if (!s) return DEFAULT_DATA;
      const loaded = JSON.parse(s);
      if (!loaded.height_corrections) loaded.height_corrections = DEFAULT_DATA.height_corrections;
      // step1 마이그레이션: effects 텍스트 → 구조화 데이터
      if (loaded.step1_conditions && loaded.step1_conditions[0] && loaded.step1_conditions[0].effects && !loaded.step1_conditions[0].care) {
        loaded.step1_conditions = DEFAULT_DATA.step1_conditions;
      }
      // step3 마이그레이션: range 텍스트 → minOff/maxOff + rec
      if (loaded.step3_height_prefs && loaded.step3_height_prefs[0] && (loaded.step3_height_prefs[0].range || !loaded.step3_height_prefs[0].rec)) {
        loaded.step3_height_prefs = DEFAULT_DATA.step3_height_prefs;
      }
      return loaded;
    } catch(e) { return DEFAULT_DATA; }
  });
  const [toast, setToast] = useState(null);
  const [showExport, setShowExport] = useState(false);
  const [fontScale, setFontScale] = useState(() => { try { return parseFloat(localStorage.getItem('survey_editor_scale'))||1; } catch(e) { return 1; } });
  useEffect(() => { try { localStorage.setItem('survey_editor_scale', fontScale); } catch(e){} }, [fontScale]);
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('survey_editor_theme')||'dark'; } catch(e) { return 'dark'; } });
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); try { localStorage.setItem('survey_editor_theme', theme); } catch(e){} }, [theme]);
  const toggleTheme = () => setTheme(prev => prev==='dark'?'light':'dark');
  const scaleUp = () => setFontScale(prev => Math.min(prev + 0.1, 1.6));
  const scaleDown = () => setFontScale(prev => Math.max(prev - 0.1, 0.8));

  // 자동 저장
  useEffect(() => {
    try { localStorage.setItem('survey_editor_data', JSON.stringify(data)); } catch(e) {}
  }, [data]);

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2000); };

  // 범용 배열 수정 헬퍼
  const updateList = (key, newList) => setData(prev => ({...prev, [key]: newList}));
  const deleteItem = (key, item) => updateList(key, data[key].filter(x => x !== item));
  const editItem = (key, oldItem, newItem) => updateList(key, data[key].map(x => x === oldItem ? newItem : x));
  const addItem = (key, newItem) => updateList(key, [...data[key], newItem]);

  // 설문 옵션 수정
  const updateSurveyOption = (qIdx, optIdx, newOpt) => {
    const q = [...data.step4_care_survey];
    q[qIdx] = {...q[qIdx], options: q[qIdx].options.map((o,i) => i===optIdx ? newOpt : o)};
    updateList('step4_care_survey', q);
  };
  const deleteSurveyOption = (qIdx, optIdx) => {
    const q = [...data.step4_care_survey];
    q[qIdx] = {...q[qIdx], options: q[qIdx].options.filter((_,i) => i!==optIdx)};
    updateList('step4_care_survey', q);
  };
  const addSurveyOption = (qIdx) => {
    const q = [...data.step4_care_survey];
    q[qIdx] = {...q[qIdx], options: [...q[qIdx].options, {label:'새 옵션', value:'new_'+Date.now(), effect:''}]};
    updateList('step4_care_survey', q);
  };

  // 내보내기
  const exportJSON = () => {
    const json = JSON.stringify(data, null, 2);
    navigator.clipboard.writeText(json).then(() => showToast('클립보드에 복사됨!')).catch(() => {});
    setShowExport(true);
  };

  // 초기화
  const resetData = () => { setData(DEFAULT_DATA); showToast('기본값으로 초기화됨'); };

  return (
    <div style={{maxWidth:'480px',margin:'0 auto',minHeight:'100vh',background:'var(--bg)',paddingBottom:'100px'}}>
      {/* 헤더 — zoom 밖 */}
      <div style={{position:'sticky',top:0,zIndex:100,background:'var(--header-bg)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',borderBottom:'1px solid var(--border)',padding:'10px 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontSize:'15px',fontWeight:800,letterSpacing:'-0.02em'}}>설문 구조 편집기</div>
          <div style={{display:'flex',gap:'6px'}}>
            <button onClick={resetData} style={{padding:'6px 10px',borderRadius:'8px',border:'1px solid var(--border)',background:'transparent',color:'var(--text2)',fontSize:'11px',fontWeight:600}}>초기화</button>
            <button onClick={exportJSON} style={{padding:'6px 12px',borderRadius:'8px',border:'none',background:'var(--accent)',color:'#000',fontSize:'11px',fontWeight:700}}>JSON 내보내기</button>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:'6px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
            <span style={{fontSize:'10px',color:'var(--text3)'}}>맞춤 추천 · 높이 진단</span>
            <button onClick={toggleTheme} style={{padding:'3px 8px',borderRadius:'6px',border:'1px solid var(--border)',background:'transparent',color:'var(--text2)',fontSize:'10px',fontWeight:600,cursor:'pointer'}}>{theme==='dark'?'☀️ 주간':'🌙 야간'}</button>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'2px',background:'var(--border)',borderRadius:'8px',padding:'2px'}}>
            <button onClick={scaleDown} style={{width:'32px',height:'28px',borderRadius:'6px',border:'none',background:fontScale<=0.8?'var(--border)':'transparent',color:'var(--text)',fontSize:'12px',fontWeight:800,cursor:fontScale<=0.8?'default':'pointer',opacity:fontScale<=0.8?0.3:1}}>A-</button>
            <span style={{fontSize:'10px',color:'var(--text3)',fontWeight:700,minWidth:'32px',textAlign:'center'}}>{Math.round(fontScale*100)}%</span>
            <button onClick={scaleUp} style={{width:'32px',height:'28px',borderRadius:'6px',border:'none',background:fontScale>=1.6?'var(--border)':'transparent',color:'var(--text)',fontSize:'12px',fontWeight:800,cursor:fontScale>=1.6?'default':'pointer',opacity:fontScale>=1.6?0.3:1}}>A+</button>
          </div>
        </div>
      </div>

      {/* 콘텐츠 — zoom 적용 */}
      <div style={{padding:'12px',display:'flex',flexDirection:'column',gap:'10px',zoom:fontScale}}>

        {/* ──── Step 1 ──── */}
        <Section title="Step 1 — 조건 체크리스트" badge={data.step1_conditions.length} color="var(--accent)" defaultOpen={true}>
          {data.step1_conditions.map((item,i) => (
            <ConditionCard key={item.id+i} item={item}
              onEdit={(d)=>editItem('step1_conditions',item,d)} />
          ))}
          <AddButton label="조건 추가" onClick={()=>addItem('step1_conditions',{id:'new_'+Date.now(),label:'새 조건',desc:'설명',hasDetail:false,care:'serviceFree',heightAdj:{withBed_max:0,noBed_min:0,noBed_max:0},recommendMattress:[],recommendFrame:[],lowFrame:false,excludeModels:[]})} />
        </Section>

        {/* ──── Step 2: 관절 상세 ──── */}
        <Section title="Step 2-1 — 관절 상세" badge={data.step2_joint_details.filter(x=>!x.hidden).length+'/'+data.step2_joint_details.length} color="var(--blue)">
          {data.step2_joint_details.map((item,i) => (
            <StructCard key={item.id+i} item={item} onEdit={(d)=>editItem('step2_joint_details',item,d)}>
              <InlineEdit value={item.desc||''} onChange={v=>editItem('step2_joint_details',item,{...item,desc:v})} placeholder="설명" style={{fontSize:'12px',color:'var(--text3)'}} />
            </StructCard>
          ))}
          <AddButton label="부위 추가" onClick={()=>addItem('step2_joint_details',{id:'new_'+Date.now(),label:'새 부위',desc:''})} />
        </Section>

        {/* ──── Step 2: 반려동물 상태 ──── */}
        <Section title="Step 2-2 — 반려동물 상태" badge={data.step2_pet_status.filter(x=>!x.hidden).length+'/'+data.step2_pet_status.length} color="var(--blue)">
          {data.step2_pet_status.map((item,i) => (
            <StructCard key={item.id+i} item={item} onEdit={(d)=>editItem('step2_pet_status',item,d)}>
              <SLabel text="높이 보정" />
              <HeightAdjMini adj={item.heightAdj||{withBed_max:0,noBed_min:0,noBed_max:0}} onChange={v=>editItem('step2_pet_status',item,{...item,heightAdj:v})} />
            </StructCard>
          ))}
          <AddButton label="상태 추가" onClick={()=>addItem('step2_pet_status',{id:'new_'+Date.now(),label:'새 상태',heightAdj:{withBed_max:0,noBed_min:0,noBed_max:0}})} />
        </Section>

        {/* ──── Step 2: 청소 환경 ──── */}
        <Section title="Step 2-3 — 청소 환경" badge={data.step2_pet_clean.filter(x=>!x.hidden).length+'/'+data.step2_pet_clean.length} color="var(--blue)">
          {data.step2_pet_clean.map((item,i) => (
            <StructCard key={item.id+i} item={item} onEdit={(d)=>editItem('step2_pet_clean',item,d)}>
              <InlineEdit value={item.desc||''} onChange={v=>editItem('step2_pet_clean',item,{...item,desc:v})} placeholder="설명" style={{fontSize:'12px',color:'var(--text3)'}} />
              <div>
                <SLabel text="자동 세팅 매트리스" />
                <ChipToggleGroup items={MATTRESS_LIST} selected={item.autoMattress||[]} onChange={v=>editItem('step2_pet_clean',item,{...item,autoMattress:v})} color="blue" />
              </div>
              <div>
                <SLabel text="자동 세팅 프레임" />
                <ChipToggleGroup items={FRAME_LIST} selected={item.autoFrame||[]} onChange={v=>editItem('step2_pet_clean',item,{...item,autoFrame:v})} color="blue" />
              </div>
              <Toggle on={item.forceSingleMattress} label="단매트리스 강제" onToggle={()=>editItem('step2_pet_clean',item,{...item,forceSingleMattress:!item.forceSingleMattress})} />
            </StructCard>
          ))}
          <AddButton label="청소 옵션 추가" onClick={()=>addItem('step2_pet_clean',{id:'new_'+Date.now(),label:'새 옵션',desc:'',autoMattress:['elite'],autoFrame:['myframeBasic'],forceSingleMattress:false})} />
        </Section>

        {/* ──── Step 3: 높이 선호 ──── */}
        {(() => {
        const [exH, setExH] = useState(40);
        return (
        <Section title="Step 3 — 침대 높이 선호" badge={data.step3_height_prefs.filter(x=>!x.hidden).length+'/'+data.step3_height_prefs.length} color="var(--orange)">
          <div style={{display:'flex',alignItems:'center',gap:'8px',padding:'10px 12px',borderRadius:'10px',background:'var(--bg)',border:'1px solid var(--border)'}}>
            <span style={{fontSize:'12px',fontWeight:700,color:'var(--text2)'}}>고객 현재 침대</span>
            <input type="number" value={exH} onChange={e=>setExH(parseInt(e.target.value)||0)}
              style={{width:'60px',padding:'6px',borderRadius:'8px',border:'1px solid var(--accent)',background:'var(--surface)',color:'var(--accent)',fontSize:'16px',fontWeight:900,textAlign:'center',outline:'none'}} />
            <span style={{fontSize:'12px',color:'var(--text3)'}}>cm 기준으로 미리보기</span>
          </div>
          {data.step3_height_prefs.map((item,i) => {
            const updPref = (patch) => editItem('step3_height_prefs',item,{...item,...patch});
            return (
            <StructCard key={item.id+i} item={item} onEdit={(d)=>editItem('step3_height_prefs',item,d)}>
              {/* 추천값 비교 */}
              {item.rec && (item.minOff !== item.rec.minOff || item.maxOff !== item.rec.maxOff) && (
                <div style={{padding:'6px 10px',borderRadius:'8px',background:'var(--orange-bg)',border:'1px solid rgba(255,159,10,0.2)',display:'flex',alignItems:'center',gap:'6px',fontSize:'11px'}}>

          const updateAdj = (idx, field, val) => {
            const newHc = JSON.parse(JSON.stringify(hc));
            newHc[hcTab].adjustments[idx][field] = parseInt(val) || 0;
            setData(prev => ({...prev, height_corrections: newHc}));

            const newHc = JSON.parse(JSON.stringify(hc));
            newHc[hcTab].adjustments.splice(idx, 1);
            setData(prev => ({...prev, height_corrections: newHc}));
          };
          const addAdj = () => {
            const newHc = JSON.parse(JSON.stringify(hc));
            newHc[hcTab].adjustments.push({id:'new_'+Date.now(), label:'새 조건', maxAdj:0, minAdj:0});

            const newHc = JSON.parse(JSON.stringify(hc));
            const keys = path.split('.');
            let obj = newHc;
            for(let i=0;i<keys.length-1;i++) obj = obj[keys[i]];

            setData(prev => ({...prev, height_corrections: newHc}));

            <AddButton label="조건 추가" onClick={addAdj} />

            {/* 구분선 */}
            <div style={{display:'flex',alignItems:'center',gap:'10px',margin:'8px 0'}}>
              <div style={{flex:1,height:'1px',background:'var(--border)'}} />
              <span style={{fontSize:'11px',fontWeight:600,color:'var(--text3)'}}>공통 설정</span>
              <div style={{flex:1,height:'1px',background:'var(--border)'}} />
            </div>

            {/* 투매트리스 추가 높이 */}
            <div style={{background:'var(--surface)',borderRadius:'12px',border:'1px solid var(--border)',padding:'14px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontSize:'13px',fontWeight:600,color:'var(--text)'}}>투매트리스 추가 높이</div>
                  <div style={{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}}>투매트리스 프레임 선택 시 최대 권장에 더해짐</div>
                </div>
                <CmInput value={hc.two_mattress_bonus} onChange={v=>updateCommon('two_mattress_bonus',v)} />
              </div>
            </div>

            {/* 기본 범위 */}
            <div style={{background:'var(--surface)',borderRadius:'12px',border:'1px solid var(--border)',padding:'14px',display:'flex',flexDirection:'column',gap:'12px'}}>
              <div style={{fontSize:'13px',fontWeight:600,color:'var(--text)'}}>기본 범위 (고객 키 미설정 시)</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:'12px',color:'var(--text2)'}}>단매트리스</span>
                <div style={{display:'flex',alignItems:'center',gap:'4px'}}>
                  <CmInput value={hc.default_range.single.min} onChange={v=>updateCommon('default_range.single.min',v)} />
                  <span style={{color:'var(--text3)',fontSize:'12px'}}>~</span>
                  <CmInput value={hc.default_range.single.max} onChange={v=>updateCommon('default_range.single.max',v)} />
                </div>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:'12px',color:'var(--text2)'}}>투매트리스</span>
                <div style={{display:'flex',alignItems:'center',gap:'4px'}}>
                  <CmInput value={hc.default_range.double.min} onChange={v=>updateCommon('default_range.double.min',v)} />
                  <span style={{color:'var(--text3)',fontSize:'12px'}}>~</span>
                  <CmInput value={hc.default_range.double.max} onChange={v=>updateCommon('default_range.double.max',v)} />
                </div>
              </div>
            </div>

            {/* 안전 제한 */}
            <div style={{background:'var(--surface)',borderRadius:'12px',border:'1px solid var(--border)',padding:'14px',display:'flex',flexDirection:'column',gap:'12px'}}>
              <div style={{fontSize:'13px',fontWeight:600,color:'var(--text)'}}>안전 제한</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <span style={{fontSize:'12px',color:'var(--text2)'}}>최소~최대 간격</span>
                  <div style={{fontSize:'10px',color:'var(--text3)'}}>범위가 너무 좁아지지 않게</div>
                </div>
                <CmInput value={hc.safety.minGap} onChange={v=>updateCommon('safety.minGap',v)} />
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <span style={{fontSize:'12px',color:'var(--text2)'}}>최소 높이 하한</span>
                  <div style={{fontSize:'10px',color:'var(--text3)'}}>이보다 낮은 침대는 추천 안 함</div>
                </div>
                <CmInput value={hc.safety.absoluteMin} onChange={v=>updateCommon('safety.absoluteMin',v)} />
              </div>
            </div>
          </Section>
          );
        })()}

        {/* ──── 높이 판정 ──── */}
        <Section title="높이 판정 기준" badge={data.height_judgment.length} color="var(--orange)">
          {data.height_judgment.map((item,i) => (
            <ItemCard key={item.id+i} item={item}
              fields={[
                {key:'label',bold:true,label:'이름'},
                {key:'rule',type:'sub',label:'조건'},
                {key:'color',label:'색상'},
                {key:'icon',label:'아이콘'},
              ]}
              onDelete={()=>deleteItem('height_judgment',item)}
              onEdit={(d)=>editItem('height_judgment',item,d)} >
              <div style={{marginTop:'4px',display:'flex',gap:'4px'}}>
                <Tag text={`${item.icon} ${item.label}`} color={item.color==='초록'?'accent':'orange'} />
                <Tag text={item.rule} color="gray" />
              </div>
            </ItemCard>
          ))}
        </Section>

      </div>

      {/* ──── 내보내기 모달 ──── */}
      {showExport && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:200,display:'flex',alignItems:'flex-end',justifyContent:'center'}}
          onClick={(e)=>{if(e.target===e.currentTarget)setShowExport(false);}}>
          <div style={{width:'100%',maxWidth:'480px',maxHeight:'70vh',background:'var(--card)',borderTopLeftRadius:'20px',borderTopRightRadius:'20px',display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{padding:'16px 18px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:'15px',fontWeight:700}}>JSON 데이터</span>
              <div style={{display:'flex',gap:'8px'}}>
                <button onClick={()=>{navigator.clipboard.writeText(JSON.stringify(data,null,2));showToast('복사됨!');}} style={{padding:'6px 14px',borderRadius:'8px',border:'none',background:'var(--accent)',color:'#000',fontSize:'12px',fontWeight:700,cursor:'pointer'}}>복사</button>
                <button onClick={()=>setShowExport(false)} style={{padding:'6px 12px',borderRadius:'8px',border:'1px solid var(--border)',background:'transparent',color:'var(--text2)',fontSize:'12px',fontWeight:600,cursor:'pointer'}}>닫기</button>
              </div>
            </div>
            <div style={{flex:1,overflow:'auto',padding:'12px'}}>
              <pre style={{fontSize:'11px',color:'var(--text2)',whiteSpace:'pre-wrap',wordBreak:'break-all',lineHeight:1.6,margin:0}}>{JSON.stringify(data,null,2)}</pre>
            </div>
            <div style={{padding:'14px 18px',borderTop:'1px solid var(--border)',background:'var(--surface)'}}>
              <div style={{fontSize:'12px',color:'var(--text3)',lineHeight:1.6}}>
                이 JSON을 Claude에게 전달하면 index.html 코드에 반영합니다.
                <br/>예: "이 JSON으로 설문 구조 업데이트해줘"
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 토스트 */}
      {toast && (
        <div style={{position:'fixed',bottom:'40px',left:'50%',transform:'translateX(-50%)',padding:'10px 20px',borderRadius:'12px',background:'var(--accent)',color:'#000',fontSize:'13px',fontWeight:700,zIndex:300,boxShadow:'0 4px 20px rgba(0,0,0,0.4)',animation:'fadeIn 0.2s ease'}}>
          {toast}
        </div>
      )}

      <style>{`@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
